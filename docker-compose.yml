services:
  # Next.js 前端
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://www.mclarenai.cn}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://81.71.29.84/api}
    image: dream-app:latest
    container_name: dream-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://www.mclarenai.cn}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://81.71.29.84/api}
    expose:
      - "3000"
    networks:
      - web

  # FastAPI 后端（Excel AI 处理）
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: dream-backend:latest
    container_name: dream-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - AI_API_KEY=${AI_API_KEY}
      - AI_API_URL=${AI_API_URL:-https://noingfushanquan.online/v1/chat/completions}
      - AI_MODEL=${AI_MODEL:-mini-max-01}
      - COS_SECRET_ID=${COS_SECRET_ID}
      - COS_SECRET_KEY=${COS_SECRET_KEY}
      - COS_BUCKET=${COS_BUCKET:-yanghao-1303848059}
      - COS_REGION=${COS_REGION:-ap-guangzhou}
      - COS_BASE_URL=${COS_BASE_URL:-https://yanghao-1303848059.cos.ap-guangzhou.myqcloud.com}
    volumes:
      - /tmp/dream-uploads:/tmp/uploads
      - /tmp/dream-results:/tmp/results
    expose:
      - "8000"
    networks:
      - web
    depends_on:
      - app

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: dream-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - backend
    networks:
      - web

networks:
  web:
    driver: bridge
