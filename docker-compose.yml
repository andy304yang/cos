# 后端单独启动（本地开发用）
# 启动：docker compose up --build
# 前端需单独在 dream/ 目录运行 npm run dev
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: excel-backend:latest
    container_name: excel-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - /tmp/excel-uploads:/tmp/uploads
      - /tmp/excel-results:/tmp/results
